<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    :root {
      --nexus-logo-color: #09090b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --nexus-logo-color: #ffffff;
      }
    }
    .nexus-fill {
      fill: var(--nexus-logo-color);
    }
  </style>
  <defs>
    <mask id="nexus-mask">
      <image href="data:image/png;base64," width="512" height="512" />
    </mask>
  </defs>
  <rect width="512" height="512" class="nexus-fill" mask="url(#nexus-mask)" />
</svg>
